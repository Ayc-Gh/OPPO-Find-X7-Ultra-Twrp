name: Bootstrap PHY110 source tree

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand audited source tree
        shell: bash
        run: |
          set -euxo pipefail
          base64 -d device-tree-source.tar.gz.b64 > /tmp/device-tree-source.tar.gz
          tar -xzf /tmp/device-tree-source.tar.gz -C .
          rm -f device-tree-source.tar.gz.b64 .github/workflows/bootstrap.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'refactor: add PHY110 upstream-based TWRP tree'
          git push origin HEAD:main
